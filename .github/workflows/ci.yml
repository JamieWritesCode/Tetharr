# Checks every pull request before it can merge, and publishes each merge to main as the :edge image for testing on a
# real stack. Every action is pinned to the full commit of a release at least 14 days old, with its version beside it.
name: CI

on:
  pull_request:
  push:
    branches: [main]

# A newer push to the same pull request or branch replaces a run still in progress
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The exact Node release in .nvmrc, with npm's download cache kept between runs
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      # Install exactly what the lockfile says, then check the types and the formatting
      - run: npm ci
      - run: npm run typecheck
      - run: npx prettier --check .

  image:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    env:
      # Only merges to main are published. Pull requests are built to prove the image still builds, then thrown away
      publish: ${{ github.event_name == 'push' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Emulation for building the arm64 image, and the builder that can make several architectures at once
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        if: env.publish == 'true'
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        if: env.publish == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Name the image :edge, and label it with the repository so GitHub links the package to it
      - id: meta
        if: env.publish == 'true'
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/jamiewritescode/tetharr
          tags: type=edge,branch=main
          flavor: latest=false

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          platforms: ${{ env.publish == 'true' && 'linux/amd64,linux/arm64' || 'linux/amd64' }}
          push: ${{ env.publish == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
