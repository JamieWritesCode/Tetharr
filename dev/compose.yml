# The development environment: real Radarr and Sonarr, plus Tetharr's server running from the live source. Start it with
# `npm run dev`, which sets PUID/PGID for your container engine. See AGENTS.md "Development".
#
# Radarr and Sonarr see the library at /data, and Tetharr sees it at /media on purpose, so path mappings are always
# exercised. The symlinks are relative, so they resolve from every container and from the host.
#
# Every port is open to this machine only. The Arrs have no login and API keys anyone can read in dev/run.ts, and the
# debugger lets whoever reaches it run code here, so none of them may be reachable from the network.
name: tetharr-dev

x-arr: &arr
  environment:
    PUID: ${PUID:-0}
    PGID: ${PGID:-0}
    TZ: Etc/UTC
  restart: unless-stopped

services:
  radarr:
    <<: *arr
    image: lscr.io/linuxserver/radarr:6.4.4
    ports: ["127.0.0.1:7878:7878"]
    volumes:
      - ./state/radarr:/config:z
      - ./media:/data:z

  sonarr:
    <<: *arr
    image: lscr.io/linuxserver/sonarr:4.0.20
    ports: ["127.0.0.1:8989:8989"]
    volumes:
      - ./state/sonarr:/config:z
      - ./media:/data:z

  tetharr:
    build:
      context: ..
      target: dev
    user: ${PUID:-0}:${PGID:-0}
    environment:
      TETHARR_DB: /config/tetharr.db
    ports: ["127.0.0.1:8787:8787", "127.0.0.1:9229:9229"]
    volumes:
      - ../src:/app/src:ro,z
      - ./state/tetharr:/config:z
      - ./media:/media:z
    restart: unless-stopped
