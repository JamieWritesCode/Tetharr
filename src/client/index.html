<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Tetharr</title>
    <!-- Apply a theme the user picked before the page draws, so it never flashes the other one first -->
    <script>
      try {
        const choice = localStorage.getItem("tetharr.theme");
        if (choice === "light" || choice === "dark") document.documentElement.dataset.theme = `tetharr-${choice}`;
      } catch {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
